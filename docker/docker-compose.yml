version: "3.9"

services:
  brain:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      - RECORD_DIR=/data/tapes
      - LIVE_TRADING=0
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_API_SECRET=${BINANCE_API_SECRET:-}
    volumes:
      - crypto-data:/data
    ports:
      - "8000:8000"

volumes:
  crypto-data:
